              private static final byte[] DESC_PS5 = new byte[]{
                  (byte) 0x05, (byte) 0x01, (byte) 0x09, (byte) 0x05, (byte) 0xA1, (byte) 0x01,
                  (byte) 0x85, (byte) 0x01, (byte) 0x05, (byte) 0x09, (byte) 0x19, (byte) 0x01,
