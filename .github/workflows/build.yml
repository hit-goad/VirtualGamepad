name: Auto Build APK and IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate Project and Build APK
        run: |
          flutter create --org com.example --project-name virtual_gamepad --platforms=android,ios -a java -i swift app_build
          cd app_build

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:math' as math;
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const VirtualGamepadApp());
          }

          class VirtualGamepadApp extends StatelessWidget {
            const VirtualGamepadApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Pro Virtual Gamepad',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121418),
                  colorScheme: const ColorScheme.dark(primary: Color(0xFF00E5FF)),
                ),
                home: const GamepadScreen(),
              );
            }
          }

          /// 逻辑按键顺序 = 发给原生层的 32 位掩码的位序。
          const List<String> kBtnOrder = [
            'BTN_A', 'BTN_B', 'BTN_X', 'BTN_Y', 'BTN_L1', 'BTN_R1', 'BTN_L2', 'BTN_R2',
            'DPAD_UP', 'DPAD_DOWN', 'DPAD_LEFT', 'DPAD_RIGHT',
            'BTN_SELECT', 'BTN_START', 'BTN_HOME', 'BTN_L3', 'BTN_R3',
          ];

          const Map<String, String> kXboxLabels = {
            'BTN_A': 'A', 'BTN_B': 'B', 'BTN_X': 'X', 'BTN_Y': 'Y',
            'BTN_L1': 'LB', 'BTN_R1': 'RB', 'BTN_L2': 'LT', 'BTN_R2': 'RT',
            'DPAD_UP': '↑', 'DPAD_DOWN': '↓', 'DPAD_LEFT': '←', 'DPAD_RIGHT': '→',
            'BTN_SELECT': 'View', 'BTN_START': 'Menu', 'BTN_HOME': 'Xbox', 'BTN_L3': 'LS', 'BTN_R3': 'RS',
          };
          const Map<String, String> kPsLabels = {
            'BTN_A': '✕', 'BTN_B': '○', 'BTN_X': '□', 'BTN_Y': '△',
            'BTN_L1': 'L1', 'BTN_R1': 'R1', 'BTN_L2': 'L2', 'BTN_R2': 'R2',
            'DPAD_UP': '↑', 'DPAD_DOWN': '↓', 'DPAD_LEFT': '←', 'DPAD_RIGHT': '→',
            'BTN_SELECT': 'Share', 'BTN_START': 'Options', 'BTN_HOME': 'PS', 'BTN_L3': 'L3', 'BTN_R3': 'R3',
          };
          // Switch 的 ABXY 位置与 Xbox 不同:同一物理位置上标签对调(下=B 右=A 左=Y 上=X)
          const Map<String, String> kSwitchLabels = {
            'BTN_A': 'B', 'BTN_B': 'A', 'BTN_X': 'Y', 'BTN_Y': 'X',
            'BTN_L1': 'L', 'BTN_R1': 'R', 'BTN_L2': 'ZL', 'BTN_R2': 'ZR',
            'DPAD_UP': '↑', 'DPAD_DOWN': '↓', 'DPAD_LEFT': '←', 'DPAD_RIGHT': '→',
            'BTN_SELECT': '−', 'BTN_START': '+', 'BTN_HOME': 'Home', 'BTN_L3': 'LS', 'BTN_R3': 'RS',
          };

          class PadWidgetConfig {
            final String id;
            double xRatio;
            double yRatio;
            double scale;
            String fn; // 这个屏幕按键实际发送的手柄功能(可在编辑模式里改)

            PadWidgetConfig({required this.id, required this.xRatio, required this.yRatio, this.scale = 1.0, String? fn})
                : fn = fn ?? id;

            Map<String, dynamic> toJson() => {'id': id, 'xRatio': xRatio, 'yRatio': yRatio, 'scale': scale, 'fn': fn};

            factory PadWidgetConfig.fromJson(Map<String, dynamic> json) => PadWidgetConfig(
                  id: json['id'] as String,
                  xRatio: (json['xRatio'] as num).toDouble(),
                  yRatio: (json['yRatio'] as num).toDouble(),
                  scale: (json['scale'] as num).toDouble(),
                  fn: json['fn'] as String?,
                );
          }

          List<PadWidgetConfig> defaultLayout() => [
                PadWidgetConfig(id: 'LEFT_STICK', xRatio: 0.16, yRatio: 0.65, scale: 1.1),
                PadWidgetConfig(id: 'RIGHT_STICK', xRatio: 0.78, yRatio: 0.65, scale: 1.15),
                PadWidgetConfig(id: 'BTN_A', xRatio: 0.88, yRatio: 0.45),
                PadWidgetConfig(id: 'BTN_B', xRatio: 0.94, yRatio: 0.32),
                PadWidgetConfig(id: 'BTN_X', xRatio: 0.82, yRatio: 0.32),
                PadWidgetConfig(id: 'BTN_Y', xRatio: 0.88, yRatio: 0.20),
                PadWidgetConfig(id: 'BTN_L1', xRatio: 0.12, yRatio: 0.18),
                PadWidgetConfig(id: 'BTN_L2', xRatio: 0.24, yRatio: 0.18),
                PadWidgetConfig(id: 'BTN_R1', xRatio: 0.88, yRatio: 0.10),
                PadWidgetConfig(id: 'BTN_R2', xRatio: 0.76, yRatio: 0.10),
                PadWidgetConfig(id: 'DPAD_UP', xRatio: 0.32, yRatio: 0.45, scale: 0.9),
                PadWidgetConfig(id: 'DPAD_DOWN', xRatio: 0.32, yRatio: 0.72, scale: 0.9),
                PadWidgetConfig(id: 'DPAD_LEFT', xRatio: 0.26, yRatio: 0.58, scale: 0.9),
                PadWidgetConfig(id: 'DPAD_RIGHT', xRatio: 0.38, yRatio: 0.58, scale: 0.9),
                PadWidgetConfig(id: 'BTN_SELECT', xRatio: 0.43, yRatio: 0.30, scale: 0.8),
                PadWidgetConfig(id: 'BTN_HOME', xRatio: 0.50, yRatio: 0.30, scale: 0.8),
                PadWidgetConfig(id: 'BTN_START', xRatio: 0.57, yRatio: 0.30, scale: 0.8),
                PadWidgetConfig(id: 'BTN_L3', xRatio: 0.06, yRatio: 0.42, scale: 0.75),
                PadWidgetConfig(id: 'BTN_R3', xRatio: 0.66, yRatio: 0.42, scale: 0.75),
              ];

          class GamepadScreen extends StatefulWidget {
            const GamepadScreen({super.key});

            @override
            State<GamepadScreen> createState() => _GamepadScreenState();
          }

          class _GamepadScreenState extends State<GamepadScreen> {
            static const MethodChannel _ch = MethodChannel('com.gamepad.hid/bluetooth');

            bool _isEditLayoutMode = false;
            bool _isToolbarCollapsed = false;
            bool _isRightStickSwipeMode = false; // 默认开启标准双摇杆回中模式，确保左右摇杆8向/360°映射正常
            bool _isGyroEnabled = false;
            bool _gyroHoldL2 = false;
            bool _gyroFlat = false;
            bool _gyroInvX = false;
            bool _gyroInvY = false;
            bool _invertLeftX = false;
            bool _invertLeftY = false;
            bool _invertRightX = false;
            bool _invertRightY = false;
            bool _swapLeftAxes = false;
            bool _swapRightAxes = false;
            int _labelStyle = 0; // 0 Xbox, 1 PS, 2 Switch(仅影响屏幕上的按键标签)
            String _hidProfile = 'xbox'; // xbox | dinput | ps5 | switch
            String _btStatus = '未连接 (点蓝牙图标)';
            String? _selectedWidgetId;

            double _leftStickSensitivity = 1.0;
            double _rightStickSensitivity = 1.2;
            double _swipeViewSensitivity = 1.5;
            double _gyroSensitivity = 1.0;
            double _stickDeadzone = 0.08;

            final Set<String> _pressedButtons = {};
            Offset _leftStickPos = Offset.zero;
            Offset _rightStickPos = Offset.zero;
            Offset _previewLeft = Offset.zero;
            Offset _previewRight = Offset.zero;
            int? _leftStickPointer;
            int? _rightStickPointer;
            int? _swipePointer;
            double _swipeAccX = 0, _swipeAccY = 0;
            Offset _swipeVel = Offset.zero;
            List<double> _lastGyro = [0, 0, 0, 1];
            bool _busy = false;
            bool _again = false;
            bool _sendQueued = false;

            Timer? _sendTimer;
            Timer? _inputTicker;
            Timer? _uiTimer;
            late List<PadWidgetConfig> _layoutConfigs;

            @override
            void initState() {
              _startInputTicker();
              super.initState();
              _layoutConfigs = defaultLayout();
              _loadSavedLayout();
              _uiTimer = Timer.periodic(const Duration(milliseconds: 1000), (_) => _refreshStatus());
            }

            @override
            void dispose() {
              _inputTicker?.cancel();
              _sendTimer?.cancel();
              _uiTimer?.cancel();
              super.dispose();
            }

            String _label(String id) {
              final m = _labelStyle == 1 ? kPsLabels : (_labelStyle == 2 ? kSwitchLabels : kXboxLabels);
              return m[id] ?? id;
            }

            Future<void> _refreshStatus() async {
              try {
                final String? s = await _ch.invokeMethod<String>('getStatus');
                if (mounted && s != null && s.isNotEmpty && s != _btStatus) setState(() => _btStatus = s);
              } catch (_) {}
            }

            Future<void> _loadSavedLayout() async {
              try {
                final String? saved = await _ch.invokeMethod<String>('loadLayout');
                if (saved != null && saved.isNotEmpty) {
                  final List decoded = jsonDecode(saved) as List;
                  final loaded = decoded.map((e) => PadWidgetConfig.fromJson(Map<String, dynamic>.from(e as Map))).toList();
                  for (final d in defaultLayout()) {
                    if (!loaded.any((e) => e.id == d.id)) loaded.add(d);
                  }
                  if (mounted) setState(() => _layoutConfigs = loaded);
                }
              } catch (_) {}
            }

            Future<void> _saveLayout() async {
              try {
                await _ch.invokeMethod('saveLayout', jsonEncode(_layoutConfigs.map((e) => e.toJson()).toList()));
              } catch (_) {}
            }

            /// 独立 X/Y 双轴死区与响应曲线处理，兼顾正交4向与斜向4向（完整8方向+360°无极坐标耦合）
            Offset _curve(Offset raw, double sens, {bool invX = false, bool invY = false, bool swapAxes = false}) {
              double rx = swapAxes ? raw.dy : raw.dx;
              double ry = swapAxes ? raw.dx : raw.dy;
              if (invX) rx = -rx;
              if (invY) ry = -ry;

              final double mag = math.sqrt(rx * rx + ry * ry);
              if (mag <= _stickDeadzone || mag == 0.0) return Offset.zero;

              final double n = ((mag - _stickDeadzone) / (1.0 - _stickDeadzone)).clamp(0.0, 1.0);
              final double c = (math.pow(n, 1.15) * sens).clamp(0.0, 1.0).toDouble();
              final double ux = rx / mag;
              final double uy = ry / mag;
              return Offset(
                (ux * c).clamp(-1.0, 1.0).toDouble(),
                (uy * c).clamp(-1.0, 1.0).toDouble(),
              );
            }

            Offset _gyroOutput() {
              if (!_isGyroEnabled) return Offset.zero;
              if (_gyroHoldL2 && !_pressedButtons.contains('BTN_L2')) return Offset.zero;
              final gx = _lastGyro[0], gy = _lastGyro[1], gz = _lastGyro[2], s = _lastGyro[3];
              double dz(double v) => v.abs() < 0.03 ? 0.0 : v;
              double yaw = _gyroFlat ? -dz(gz) : -dz(gx) * s;
              double pitch = dz(gy) * s;
              if (_gyroInvX) yaw = -yaw;
              if (_gyroInvY) pitch = -pitch;
              final k = 0.30 * _gyroSensitivity;
              return Offset(yaw * k, pitch * k);
            }

            void _requestSend() {
              if (_isEditLayoutMode || _sendQueued) return;
              _sendQueued = true;
              _sendTimer?.cancel();
              _sendTimer = Timer(const Duration(milliseconds: 2), () {
                _sendQueued = false;
                _pump();
              });
            }

            void _startInputTicker() {
              _inputTicker?.cancel();
              _inputTicker = Timer.periodic(const Duration(milliseconds: 4), (_) {
                if (!_isEditLayoutMode) _requestSend();
              });
            }

            Future<void> _pump() async {
              if (_busy) {
                _again = true;
                return;
              }
              _busy = true;
              try {
                do {
                  _again = false;
                  await _sendOnce();
                } while (_again);
              } finally {
                _busy = false;
              }
            }

            Future<void> _sendOnce() async {
              if (_isEditLayoutMode) return;
              try {
                if (_isRightStickSwipeMode) {
                  final ix = (_invertRightX ? -_swipeAccX : _swipeAccX) / 18.0 * _swipeViewSensitivity;
                  final iy = (_invertRightY ? -_swipeAccY : _swipeAccY) / 18.0 * _swipeViewSensitivity;
                  final sx = _swapRightAxes ? iy : ix;
                  final sy = _swapRightAxes ? ix : iy;
                  _swipeVel = Offset(_swipeVel.dx * 0.45 + sx * 0.55, _swipeVel.dy * 0.45 + sy * 0.55);
                } else {
                  _swipeVel = Offset.zero;
                }
                _swipeAccX = 0;
                _swipeAccY = 0;

                final left = _curve(
                  _leftStickPos,
                  _leftStickSensitivity,
                  invX: _invertLeftX,
                  invY: _invertLeftY,
                  swapAxes: _swapLeftAxes,
                );
                final base = _isRightStickSwipeMode
                    ? _swipeVel
                    : _curve(
                        _rightStickPos,
                        _rightStickSensitivity,
                        invX: _invertRightX,
                        invY: _invertRightY,
                        swapAxes: _swapRightAxes,
                      );
                final g = _gyroOutput();
                final right = Offset((base.dx + g.dx).clamp(-1.0, 1.0).toDouble(), (base.dy + g.dy).clamp(-1.0, 1.0).toDouble());
                _previewLeft = left;
                _previewRight = right;

                int mask = 0;
                for (int i = 0; i < kBtnOrder.length; i++) {
                  if (_pressedButtons.contains(kBtnOrder[i])) mask |= (1 << i);
                }
                int s8(double v) => (v.clamp(-1.0, 1.0) * 127).round();

                final Uint8List p = Uint8List(10);
                final bd = ByteData.view(p.buffer);
                bd.setUint32(0, mask, Endian.little);
                bd.setInt8(4, s8(left.dx));
                bd.setInt8(5, s8(left.dy));
                bd.setInt8(6, s8(right.dx));
                bd.setInt8(7, s8(right.dy));
                bd.setUint8(8, _pressedButtons.contains('BTN_L2') ? 255 : 0);
                bd.setUint8(9, _pressedButtons.contains('BTN_R2') ? 255 : 0);

                unawaited(_ch.invokeMethod<List<dynamic>>('sendState', p).then((res) {
                  if (res != null && res.length >= 4) {
                    _lastGyro = res.map((e) => (e as num).toDouble()).toList();
                  }
                }).catchError((_) {}));
              } catch (_) {}
            }

            // ---------------- 蓝牙 ----------------
            Future<void> _startBluetooth() async {
              try {
                final String? r = await _ch.invokeMethod<String>('startHidProfile', _hidProfile);
                if (r != null && mounted) setState(() => _btStatus = r);
              } on PlatformException catch (e) {
                if (mounted) setState(() => _btStatus = '蓝牙提示: ${e.message}');
              } catch (e) {
                if (mounted) setState(() => _btStatus = '蓝牙提示: $e');
              }
              if (mounted) _showConnectSheet();
            }

            Future<void> _showConnectSheet() async {
              List<List<String>> bonded = [];
              try {
                final r = await _ch.invokeMethod<List<dynamic>>('getBonded');
                if (r != null) bonded = r.map((e) => (e as List).map((x) => x.toString()).toList()).toList();
              } catch (_) {}
              if (!mounted) return;
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF1B1F27),
                builder: (ctx) => SafeArea(
                  child: ListView(
                    shrinkWrap: true,
                    padding: const EdgeInsets.all(12),
                    children: [
                      const Text('连接方式 (兼容 Android 11 ~ 15+)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.cyanAccent)),
                      ListTile(
                        leading: const Icon(Icons.visibility),
                        title: const Text('让手机可被发现 (首次配对)'),
                        subtitle: const Text('然后在电脑/平板/电视/接收端手机的蓝牙设置里搜索并配对本手机'),
                        onTap: () async {
                          Navigator.pop(ctx);
                          try { await _ch.invokeMethod('makeDiscoverable'); } catch (_) {}
                        },
                      ),
                      const Padding(
                        padding: EdgeInsets.symmetric(horizontal: 16, vertical: 4),
                        child: Text(
                          '提示：切换手柄协议或更新后，若发现方向异常，请先在接收端系统的蓝牙设置中“取消配对/忽略此设备”，再重新配对（防止系统缓存旧 HID 描述符）。',
                          style: TextStyle(fontSize: 11, color: Colors.amberAccent),
                        ),
                      ),
                      const Divider(color: Colors.white24),
                      if (bonded.isEmpty)
                        const Padding(padding: EdgeInsets.all(12), child: Text('暂无已配对设备', style: TextStyle(color: Colors.white54))),
                      for (final d in bonded)
                        ListTile(
                          leading: const Icon(Icons.bluetooth),
                          title: Text(d[0]),
                          subtitle: Text(d[1]),
                          onTap: () async {
                            Navigator.pop(ctx);
                            try { await _ch.invokeMethod('connectHost', d[1]); } catch (_) {}
                          },
                        ),
                    ],
                  ),
                ),
              );
            }

            // ---------------- 界面 ----------------
            @override
            Widget build(BuildContext context) {
              final Size screenSize = MediaQuery.of(context).size;
              return Scaffold(
                body: Stack(
                  children: [
                    if (_isRightStickSwipeMode && !_isEditLayoutMode)
                      Positioned(
                        left: screenSize.width * 0.45,
                        top: 56,
                        right: 0,
                        bottom: 0,
                        child: Listener(
                          behavior: HitTestBehavior.translucent,
                          onPointerDown: (e) {
                            _swipePointer ??= e.pointer;
                          },
                          onPointerMove: (e) {
                            if (_swipePointer == e.pointer) {
                              _onSwipeDelta(e.delta);
                            }
                          },
                          onPointerUp: (e) {
                            if (_swipePointer == e.pointer) _swipePointer = null;
                          },
                          onPointerCancel: (e) {
                            if (_swipePointer == e.pointer) _swipePointer = null;
                          },
                          child: Container(
                            decoration: const BoxDecoration(border: Border(left: BorderSide(color: Color(0x2600E5FF), width: 1))),
                            alignment: Alignment.bottomRight,
                            padding: const EdgeInsets.all(16),
                            child: const Text(
                              '3D 自由滑屏视角区',
                              style: TextStyle(color: Color(0x7300E5FF), fontSize: 12),
                            ),
                          ),
                        ),
                      ),
                    ..._layoutConfigs.map((c) => _buildPositionedControl(c, screenSize)),
                    if (!_isToolbarCollapsed)
                      Positioned(top: 8, left: 16, right: 16, child: _buildTopToolbar()),
                    if (_isToolbarCollapsed)
                      Positioned(
                        top: 10,
                        right: 12,
                        child: Material(
                          color: Colors.transparent,
                          child: Container(
                            decoration: BoxDecoration(
                              color: const Color(0xCC000000),
                              shape: BoxShape.circle,
                              border: Border.all(color: Colors.white24),
                            ),
                            child: IconButton(
                              tooltip: '展开设置',
                              icon: const Icon(Icons.tune, color: Colors.cyanAccent, size: 20),
                              onPressed: () => setState(() => _isToolbarCollapsed = false),
                            ),
                          ),
                        ),
                      ),
                    if (_isEditLayoutMode && _selectedWidgetId != null)
                      Positioned(
                        bottom: 16,
                        left: screenSize.width * 0.08,
                        right: screenSize.width * 0.08,
                        child: _buildScaleEditorBar(),
                      ),
                  ],
                ),
              );
            }

            void _onSwipeDelta(Offset delta) {
              if (_isEditLayoutMode) return;
              _swipeAccX += delta.dx;
              _swipeAccY += delta.dy;
              _requestSend();
            }

            Widget _buildTopToolbar() {
              return Container(
                padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 6),
                decoration: BoxDecoration(
                  color: const Color(0xA6000000),
                  borderRadius: BorderRadius.circular(24),
                  border: Border.all(color: Colors.white12),
                ),
                child: Row(
                  children: [
                    IconButton(
                      icon: const Icon(Icons.bluetooth_connected, color: Colors.cyanAccent, size: 20),
                      onPressed: _startBluetooth,
                    ),
                    Flexible(
                      flex: 2,
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Text(_btStatus, maxLines: 1, overflow: TextOverflow.ellipsis,
                              style: const TextStyle(fontSize: 11, color: Colors.white70)),
                          Text(
                            'L(${_previewLeft.dx.toStringAsFixed(2)}, ${_previewLeft.dy.toStringAsFixed(2)})  R(${_previewRight.dx.toStringAsFixed(2)}, ${_previewRight.dy.toStringAsFixed(2)})',
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(fontSize: 10, color: Colors.cyanAccent),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(width: 8),
                    Expanded(
                      flex: 3,
                      child: SingleChildScrollView(
                        scrollDirection: Axis.horizontal,
                        reverse: true,
                        child: Row(
                          children: [
                            FilterChip(
                              label: Text(_isRightStickSwipeMode ? '右摇杆: 3D滑屏视角' : '右摇杆: 传统回中', style: const TextStyle(fontSize: 11)),
                              selected: _isRightStickSwipeMode,
                              onSelected: (v) => setState(() => _isRightStickSwipeMode = v),
                            ),
                            const SizedBox(width: 8),
                            FilterChip(
                              label: Text('陀螺仪体感 (${_gyroSensitivity.toStringAsFixed(1)}x)', style: const TextStyle(fontSize: 11)),
                              selected: _isGyroEnabled,
                              onSelected: (v) => setState(() => _isGyroEnabled = v),
                            ),
                            const SizedBox(width: 8),
                            ElevatedButton.icon(
                              icon: Icon(_isEditLayoutMode ? Icons.save : Icons.open_with, size: 15),
                              label: Text(_isEditLayoutMode ? '保存布局' : '自定义按键', style: const TextStyle(fontSize: 12)),
                              onPressed: () {
                                setState(() => _isEditLayoutMode = !_isEditLayoutMode);
                                if (!_isEditLayoutMode) _saveLayout();
                              },
                            ),
                            IconButton(
                              tooltip: '收起设置栏',
                              icon: const Icon(Icons.keyboard_arrow_up, size: 20),
                              onPressed: () => setState(() => _isToolbarCollapsed = true),
                            ),
                            IconButton(icon: const Icon(Icons.tune, size: 20), onPressed: _showSettingsSheet),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _buildPositionedControl(PadWidgetConfig cfg, Size screenSize) {
              final bool isStick = cfg.id == 'LEFT_STICK' || cfg.id == 'RIGHT_STICK';
              final double finalSize = (isStick ? 135.0 : 58.0) * cfg.scale;
              final double left = (cfg.xRatio * screenSize.width) - finalSize / 2;
              final double top = (cfg.yRatio * screenSize.height) - finalSize / 2;

              Widget child;
              if (cfg.id == 'LEFT_STICK') {
                child = _buildAnalogStick(
                  size: finalSize,
                  label: 'L',
                  value: _leftStickPos,
                  activePointer: _leftStickPointer,
                  onPointerChanged: (p) => _leftStickPointer = p,
                  onChanged: (v) {
                    setState(() => _leftStickPos = v);
                    _requestSend();
                  },
                );
              } else if (cfg.id == 'RIGHT_STICK') {
