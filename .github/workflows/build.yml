              GeneratedPluginRegistrant.register(with: self)

              var messenger: FlutterBinaryMessenger? = nil
              if let controller = window?.rootViewController as? FlutterViewController {
                messenger = controller.binaryMessenger
              } else {
                messenger = self.registrar(forPlugin: "GamepadBridge")?.messenger()
              }

              if motionManager.isGyroAvailable {
                motionManager.gyroUpdateInterval = 1.0 / 60.0
                motionManager.startGyroUpdates(to: .main) { [weak self] (data, _) in
                  guard let self = self, let rate = data?.rotationRate else { return }
                  self.gyroX = rate.x
                  self.gyroY = rate.y
                  self.gyroZ = rate.z
                }
              }

              if let messenger = messenger {
                let channel = FlutterMethodChannel(name: "com.gamepad.hid/bluetooth", binaryMessenger: messenger)
                let note = "iOS 不允许 App 充当蓝牙手柄:此版本仅为界面/体感预览"
                channel.setMethodCallHandler { [weak self] (call: FlutterMethodCall, result: @escaping FlutterResult) in
                  guard let self = self else { return }
                  switch call.method {
                  case "sendState":
                    result([self.gyroX, self.gyroY, self.gyroZ, 1.0])
                  case "getStatus", "startHidProfile":
                    result(note)
                  case "getBonded":
                    result([])
                  case "saveLayout":
                    if let s = call.arguments as? String { UserDefaults.standard.set(s, forKey: "custom_gamepad_layout_v1") }
                    result(true)
                  case "loadLayout":
                    result(UserDefaults.standard.string(forKey: "custom_gamepad_layout_v1"))
                  case "makeDiscoverable", "connectHost":
                    result(nil)
                  default:
                    result(FlutterMethodNotImplemented)
                  }
                }
              }

              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          EOF

          plutil -replace NSMotionUsageDescription -string "使用陀螺仪模拟原生体感控制" ios/Runner/Info.plist
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r VirtualGamepad-iOS.ipa Payload
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Installer
          path: app_build/VirtualGamepad-iOS.ipa
