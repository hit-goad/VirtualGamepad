          @SuppressLint({"MissingPermission", "NewApi"})
          public class MainActivity extends FlutterActivity implements SensorEventListener {
              private static final String CHANNEL = "com.gamepad.hid/bluetooth";
              private BluetoothHidDevice hidDevice;
              private BluetoothDevice hostDevice;
              private double gyroX = 0.0;
              private double gyroY = 0.0;
              private double gyroZ = 0.0;

              // 默认 Xbox 描述符
              private static final byte[] DESC_XBOX = new byte[]{
                  (byte) 0x05, (byte) 0x01, (byte) 0x09, (byte) 0x05, (byte) 0xA1, (byte) 0x01,
                  (byte) 0x85, (byte) 0x01, (byte) 0x05, (byte) 0x09, (byte) 0x19, (byte) 0x01,
                  (byte) 0x29, (byte) 0x10, (byte) 0x15, (byte) 0x00, (byte) 0x25, (byte) 0x01,
                  (byte) 0x75, (byte) 0x01, (byte) 0x95, (byte) 0x10, (byte) 0x81, (byte) 0x02,
                  (byte) 0x05, (byte) 0x01, (byte) 0x09, (byte) 0x30, (byte) 0x09, (byte) 0x31,
                  (byte) 0x09, (byte) 0x32, (byte) 0x09, (byte) 0x35, (byte) 0x15, (byte) 0x81,
