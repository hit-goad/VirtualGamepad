          EOF

          cat << 'EOF' > ios/Runner/AppDelegate.swift
          import UIKit
          import Flutter
          import CoreMotion

          @main
          @objc class AppDelegate: FlutterAppDelegate {
            private let motionManager = CMMotionManager()
            private var gyroX: Double = 0.0
            private var gyroY: Double = 0.0
            private var gyroZ: Double = 0.0

            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              let controller : FlutterViewController = window?.rootViewController as! FlutterViewController
              let channel = FlutterMethodChannel(name: "com.gamepad.hid/bluetooth", binaryMessenger: controller.binaryMessenger)

              if motionManager.isGyroAvailable {
                motionManager.gyroUpdateInterval = 1.0 / 60.0
                motionManager.startGyroUpdates(to: .main) { [weak self] (data, error) in
                  guard let self = self, let rate = data?.rotationRate else { return }
                  self.gyroX = rate.x
                  self.gyroY = rate.y
                  self.gyroZ = rate.z
                }
              }

              channel.setMethodCallHandler { [weak self] (call: FlutterMethodCall, result: @escaping FlutterResult) in
                guard let self = self else { return }
                switch call.method {
                case "getGyro":
                  result([self.gyroX, self.gyroY, self.gyroZ])
                case "saveLayout":
                  if let jsonStr = call.arguments as? String {
                    UserDefaults.standard.set(jsonStr, forKey: "custom_gamepad_layout_v1")
                  }
                  result(true)
                case "loadLayout":
                  result(UserDefaults.standard.string(forKey: "custom_gamepad_layout_v1"))
                case "startHidProfile":
                  result("iOS 低延迟映射与陀螺仪体感已就绪")
                case "sendHidReport":
                  result(nil)
                default:
                  result(FlutterMethodNotImplemented)
                }
              }

              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          EOF

          plutil -replace NSMotionUsageDescription -string "使用陀螺仪模拟原生体感控制" ios/Runner/Info.plist
          plutil -replace NSBluetoothAlwaysUsageDescription -string "使用蓝牙连接目标设备映射按键" ios/Runner/Info.plist
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r VirtualGamepad-iOS.ipa Payload
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Installer
          path: app_build/VirtualGamepad-iOS.ipa
