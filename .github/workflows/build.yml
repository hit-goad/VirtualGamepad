              @Override
              public void configureFlutterEngine(FlutterEngine flutterEngine) {
                  super.configureFlutterEngine(flutterEngine);
                  SensorManager sensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                  if (sensorManager != null) {
                      Sensor gyroSensor = sensorManager.getDefaultSensor(Sensor.TYPE_GYROSCOPE);
                      if (gyroSensor != null) {
                          sensorManager.registerListener(this, gyroSensor, SensorManager.SENSOR_DELAY_GAME);
                      }
                  }
                  SharedPreferences prefs = getSharedPreferences("gamepad_prefs", Context.MODE_PRIVATE);

                  new MethodChannel(flutterEngine.getDartExecutor().getBinaryMessenger(), CHANNEL)
                      .setMethodCallHandler((call, result) -> {
                          switch (call.method) {
                              case "getGyro":
                                  result.success(Arrays.asList(gyroX, gyroY, gyroZ));
                                  break;
                              case "saveLayout":
                                  if (call.arguments instanceof String) {
                                      prefs.edit().putString("custom_gamepad_layout_v1", (String) call.arguments).apply();
                                  }
                                  result.success(true);
                                  break;
                              case "loadLayout":
                                  result.success(prefs.getString("custom_gamepad_layout_v1", null));
                                  break;
                              case "startHidProfile":
                                  String profile = call.argument("profile");
                                  initBluetoothHid(result, profile != null ? profile : "XBOX");
                                  break;
                              case "sendHidReport":
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P && call.arguments instanceof byte[]) {
                                      byte[] bytes = (byte[]) call.arguments;
                                      if (bytes.length >= 7 && hidDevice != null && hostDevice != null) {
                                          int reportId = bytes[0];
                                          byte[] payload = Arrays.copyOfRange(bytes, 1, 7);
                                          try {
                                              hidDevice.sendReport(hostDevice, reportId, payload);
                                          } catch (Exception ignored) {}
                                      }
                                  }
                                  result.success(null);
                                  break;
                              default:
                                  result.notImplemented();
                                  break;
                          }
                      });
              }

              @Override
              public void onSensorChanged(SensorEvent event) {
                  if (event != null && event.sensor != null && event.sensor.getType() == Sensor.TYPE_GYROSCOPE) {
                      gyroX = event.values[0];
                      gyroY = event.values[1];
                      gyroZ = event.values[2];
                  }
              }

              @Override
              public void onAccuracyChanged(Sensor sensor, int accuracy) {}

              private void initBluetoothHid(MethodChannel.Result result, String profileName) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.P) {
                      result.success("需要 Android 9.0+");
                      return;
                  }
                  BluetoothManager btManager = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                  BluetoothAdapter adapter = btManager != null ? btManager.getAdapter() : null;
                  if (adapter == null || !adapter.isEnabled()) {
                      result.success("请先开启手机蓝牙");
                      return;
                  }

                  byte[] targetDesc = DESC_XBOX;
                  String devName = "Xbox Wireless Controller";
                  if ("PS5".equals(profileName)) {
                      targetDesc = DESC_PS5;
                      devName = "Wireless Controller";
                  } else if ("SWITCH".equals(profileName)) {
                      targetDesc = DESC_SWITCH;
                      devName = "Pro Controller";
                  }

                  try {
                      adapter.getProfileProxy(this, new BluetoothProfile.ServiceListener() {
                          @Override
                          public void onServiceConnected(int profile, BluetoothProfile proxy) {
                              if (profile == BluetoothProfile.HID_DEVICE && proxy instanceof BluetoothHidDevice) {
                                  hidDevice = (BluetoothHidDevice) proxy;
                                  BluetoothHidDeviceAppSdpSettings sdp = new BluetoothHidDeviceAppSdpSettings(
                                      devName, "Virtual Gamepad", "FlutterHID",
                                      BluetoothHidDevice.SUBCLASS1_COMBO, targetDesc
                                  );
                                  try {
                                      hidDevice.unregisterApp(sdp);
                                  } catch (Exception ignored) {}
                                  try {
                                      hidDevice.registerApp(sdp, null, null, Executors.newSingleThreadExecutor(),
                                          new BluetoothHidDevice.Callback() {
                                              @Override
                                              public void onConnectionStateChanged(BluetoothDevice device, int state) {
                                                  if (state == BluetoothProfile.STATE_CONNECTED) {
                                                      hostDevice = device;
                                                  }
                                              }
                                          });
                                  } catch (Exception ignored) {}
                              }
                          }
                          @Override
                          public void onServiceDisconnected(int profile) {
                              hidDevice = null;
                          }
                      }, BluetoothProfile.HID_DEVICE);
                      result.success("已切换: " + profileName);
                  } catch (Exception e) {
                      result.success("错误: " + e.getMessage());
                  }
              }
          }
