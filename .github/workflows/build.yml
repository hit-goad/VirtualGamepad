          /// 独立有状态摇杆组件：基于 RenderBox.globalToLocal 实时换算触控坐标，
          /// 彻底杜绝外层变换或手势竞技场导致的对角线锁定。
          class AnalogStickWidget extends StatefulWidget {
            final double size;
            final String label;
            final Offset value;
            final ValueChanged<Offset> onChanged;

            const AnalogStickWidget({
              super.key,
              required this.size,
              required this.label,
              required this.value,
              required this.onChanged,
            });

            @override
            State<AnalogStickWidget> createState() => _AnalogStickWidgetState();
          }

          class _AnalogStickWidgetState extends State<AnalogStickWidget> {
            int? _pointerId;

            void _updateFromGlobal(Offset globalPos) {
              final RenderBox? box = context.findRenderObject() as RenderBox?;
              if (box == null || !box.hasSize) return;
              final Offset local = box.globalToLocal(globalPos);
              final double radius = widget.size / 2.0;
              final double knob = widget.size * 0.22;
              final double maxDist = math.max(1.0, radius - knob);

              final double dx = local.dx - radius;
              final double dy = local.dy - radius;
              final double dist = math.sqrt(dx * dx + dy * dy);

              double nx = dx / maxDist;
              double ny = dy / maxDist;
              if (dist > maxDist && dist > 0.0) {
                nx = dx / dist;
                ny = dy / dist;
              }
              widget.onChanged(Offset(nx.clamp(-1.0, 1.0).toDouble(), ny.clamp(-1.0, 1.0).toDouble()));
            }

            @override
            Widget build(BuildContext context) {
              final double radius = widget.size / 2.0;
              final double knob = widget.size * 0.22;
              final double maxDist = math.max(1.0, radius - knob);

              return Listener(
                behavior: HitTestBehavior.opaque,
                onPointerDown: (e) {
                  if (_pointerId == null) {
                    _pointerId = e.pointer;
                    _updateFromGlobal(e.position);
                  }
                },
                onPointerMove: (e) {
                  if (_pointerId == e.pointer) {
                    _updateFromGlobal(e.position);
                  }
                },
                onPointerUp: (e) {
                  if (_pointerId == e.pointer) {
                    _pointerId = null;
                    widget.onChanged(Offset.zero);
                  }
                },
                onPointerCancel: (e) {
                  if (_pointerId == e.pointer) {
                    _pointerId = null;
                    widget.onChanged(Offset.zero);
                  }
                },
                child: Container(
                  width: widget.size,
                  height: widget.size,
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    color: const Color(0x14FFFFFF),
                    border: Border.all(color: const Color(0x6600E5FF), width: 2),
                  ),
                  child: Stack(
                    alignment: Alignment.center,
                    children: [
                      Container(width: widget.size * 0.82, height: 1, color: const Color(0x2600E5FF)),
                      Container(width: 1, height: widget.size * 0.82, color: const Color(0x2600E5FF)),
                      Transform.translate(
                        offset: Offset(widget.value.dx * maxDist, widget.value.dy * maxDist),
                        child: Container(
                          width: knob * 2,
                          height: knob * 2,
                          decoration: const BoxDecoration(
                            shape: BoxShape.circle,
                            color: Color(0xBF00E5FF),
                            boxShadow: [BoxShadow(color: Colors.black54, blurRadius: 6)],
                          ),
                          alignment: Alignment.center,
                          child: Text(widget.label, style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
