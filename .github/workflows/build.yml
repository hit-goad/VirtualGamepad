              private static final int A = 1, B = 1 << 1, X = 1 << 2, Y = 1 << 3, L1 = 1 << 4, R1 = 1 << 5,
                  L2 = 1 << 6, R2 = 1 << 7, UP = 1 << 8, DOWN = 1 << 9, LEFT = 1 << 10, RIGHT = 1 << 11,
                  SELECT = 1 << 12, START = 1 << 13, HOME = 1 << 14, L3 = 1 << 15, R3 = 1 << 16;

              // ------------------------------------------------------------------
              // 生命周期
              // ------------------------------------------------------------------
              @Override
              protected void onResume() {
                  super.onResume();
                  try {
                      sensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                      if (sensorManager != null) {
                          Sensor g = sensorManager.getDefaultSensor(Sensor.TYPE_GYROSCOPE);
                          if (g != null) sensorManager.registerListener(this, g, 5000);
                      }
                  } catch (Throwable ignored) {}
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  try { if (sensorManager != null) sensorManager.unregisterListener(this); } catch (Throwable ignored) {}
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  if (e != null && e.sensor != null && e.sensor.getType() == Sensor.TYPE_GYROSCOPE) {
                      gyro[0] = e.values[0]; gyro[1] = e.values[1]; gyro[2] = e.values[2];
                  }
              }

              @Override
              public void onAccuracyChanged(Sensor sensor, int accuracy) {}

              @Override
              public void configureFlutterEngine(FlutterEngine engine) {
                  super.configureFlutterEngine(engine);
                  final SharedPreferences prefs = getSharedPreferences("gamepad_prefs", Context.MODE_PRIVATE);
                  new MethodChannel(engine.getDartExecutor().getBinaryMessenger(), CHANNEL).setMethodCallHandler((call, result) -> {
                      try {
                          switch (call.method) {
                              case "sendState":
                                  if (call.arguments instanceof byte[]) sendState((byte[]) call.arguments);
                                  result.success(gyroList());
                                  break;
                              case "getStatus":
                                  result.success(status);
                                  break;
                              case "startHidProfile":
                                  startHid(call.arguments instanceof String ? (String) call.arguments : "xbox", result);
                                  break;
                              case "makeDiscoverable":
                                  makeDiscoverable();
                                  result.success(null);
                                  break;
                              case "enableBluetooth":
                                  enableBluetooth();
                                  result.success(null);
                                  break;
                              case "getBonded":
                                  result.success(bonded());
                                  break;
                              case "connectHost":
                                  if (call.arguments instanceof String) connectHost((String) call.arguments);
                                  result.success(null);
                                  break;
                              case "saveLayout":
                                  if (call.arguments instanceof String)
                                      prefs.edit().putString("custom_gamepad_layout_v1", (String) call.arguments).apply();
                                  result.success(true);
                                  break;
                              case "loadLayout":
                                  result.success(prefs.getString("custom_gamepad_layout_v1", null));
                                  break;
                              default:
                                  result.notImplemented();
                          }
                      } catch (Throwable t) {
                          // 任何异常都不能让 App 闪退
                          status = "错误: " + t.getClass().getSimpleName() + " " + t.getMessage();
                          try { result.success(status); } catch (Throwable ignored) {}
                      }
                  });
              }

              private List<Object> gyroList() {
                  int rot = Surface.ROTATION_90;
                  try {
                      android.view.Display dp = Build.VERSION.SDK_INT >= 30 ? getDisplay() : getWindowManager().getDefaultDisplay();
                      if (dp != null) rot = dp.getRotation();
                  } catch (Throwable ignored) {}
                  double sign = (rot == Surface.ROTATION_270) ? -1.0 : 1.0;
                  return Arrays.<Object>asList((double) gyro[0], (double) gyro[1], (double) gyro[2], sign);
              }

              // ------------------------------------------------------------------
              // 权限 + 启动 HID
              // ------------------------------------------------------------------
              private boolean hasBtPermission() {
                  if (Build.VERSION.SDK_INT < 31) return true;
                  return checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED
                      && checkSelfPermission(Manifest.permission.BLUETOOTH_ADVERTISE) == PackageManager.PERMISSION_GRANTED;
              }

              private void startHid(String wantedProfile, MethodChannel.Result result) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.P) {
                      result.success("需要 Android 9.0 及以上系统");
                      return;
                  }
                  if (!hasBtPermission()) {
                      if (pendingResult != null) { result.success("正在等待权限授权…"); return; }
                      pendingResult = result;
                      pendingProfile = wantedProfile;
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_ADVERTISE}, REQ_BT);
                      return;
                  }
                  doStart(wantedProfile, result);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] grants) {
                  super.onRequestPermissionsResult(code, perms, grants);
                  if (code != REQ_BT) return;
                  MethodChannel.Result r = pendingResult;
                  String p = pendingProfile;
                  pendingResult = null;
                  pendingProfile = null;
                  if (r == null) return;
                  boolean ok = grants.length > 0;
                  for (int g : grants) if (g != PackageManager.PERMISSION_GRANTED) ok = false;
                  if (ok) doStart(p == null ? "xbox" : p, r);
                  else {
                      status = "未授予“附近的设备”权限";
                      r.success("未授予“附近的设备”权限,请到系统设置→应用→本应用→权限里允许");
                  }
              }

              private String normalizeProfile(String wantedProfile) {
                  if ("dinput".equals(wantedProfile)) return "dinput";
                  if ("ps5".equals(wantedProfile)) return "ps5";
                  if ("switch".equals(wantedProfile)) return "switch";
                  return "xbox";
              }

              private void doStart(String wantedProfile, MethodChannel.Result result) {
                  try {
                      BluetoothManager m = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                      adapter = m != null ? m.getAdapter() : null;
                      if (adapter == null) { result.success("当前设备不支持蓝牙"); return; }
                      if (!adapter.isEnabled()) { result.success("请先在系统里打开蓝牙,再点一次"); return; }
                      profile = normalizeProfile(wantedProfile);

                      if (hidDevice != null) {                       // 已有代理:换描述符需要重新注册
                          try { hidDevice.unregisterApp(); } catch (Throwable ignored) {}
                          hostDevice = null;
                          currentReport = null;
                          result.success("正在切换协议，请稍候并在电脑蓝牙中重新配对");
                          // unregisterApp 后系统需要几十毫秒释放 SDP；立即 registerApp 会偶发失败。
                          new android.os.Handler(getMainLooper()).postDelayed(() -> {
                              try {
                                  if (hidDevice != null) startRegister();
                              } catch (Throwable t) {
                                  status = "重新注册 HID 出错: " + t.getMessage();
                              }
                          }, 400);
                          return;
                      }
                      boolean ok = adapter.getProfileProxy(this, new BluetoothProfile.ServiceListener() {
                          @Override
                          public void onServiceConnected(int p, BluetoothProfile proxy) {
                              if (p != BluetoothProfile.HID_DEVICE) return;
                              try {
                                  hidDevice = (BluetoothHidDevice) proxy;
                                  startRegister();
                              } catch (Throwable t) {
                                  status = "注册 HID 出错: " + t.getMessage();
                              }
                          }

                          @Override
                          public void onServiceDisconnected(int p) { hidDevice = null; hostDevice = null; }
                      }, BluetoothProfile.HID_DEVICE);
                      if (ok) {
                          // 个别机型/被裁剪的系统没有 HID 设备角色:getProfileProxy 会一直不回调,
                          // 用户只看到"正在启动…"却永远连不上,这里补一个超时提示。
                          new android.os.Handler(getMainLooper()).postDelayed(() -> {
                              if (hidDevice == null) status = "本机蓝牙栈没有提供 HID 设备角色(系统不支持或被裁剪)";
                          }, 4000);
                      }
                      result.success(ok ? "正在启动手柄… 请点“让手机可被发现”并在主机上配对"
                                        : "本机系统不支持“蓝牙 HID 设备”模式");
                  } catch (Throwable t) {
                      result.success("蓝牙启动失败: " + t.getClass().getSimpleName() + " " + t.getMessage());
                  }
              }

              /** 注册 HID 应用(换描述符后也走这里)。
               *  上一次安装的版本可能把 HID 应用留在系统里,直接 registerApp 会一直返回 false,
               *  所以失败时先 unregisterApp,等 SDP 释放后再试一次。 */
              private void startRegister() {
                  if (registerAppOnce()) { status = "手柄已就绪:请在主机蓝牙里配对本手机"; return; }
                  try { if (hidDevice != null) hidDevice.unregisterApp(); } catch (Throwable ignored) {}
                  status = "正在重置 HID 注册…";
                  new android.os.Handler(getMainLooper()).postDelayed(() -> {
                      status = registerAppOnce()
                              ? "手柄已就绪:请在主机蓝牙里配对本手机"
                              : "注册 HID 失败(本机可能不支持 HID 设备模式)";
                  }, 500);
              }

              private boolean registerAppOnce() {
                  byte[] desc;
                  String name;
                  String description;
                  if ("dinput".equals(profile)) {
                      // 保持旧版本完全一致，避免 Windows 已配对设备因 SDP 变化无法重连。
                      desc = DESC_DINPUT; name = "Virtual Gamepad"; description = "Virtual Gamepad";
                  } else if ("ps5".equals(profile)) {
                      desc = DESC_PS5; name = "Wireless Controller"; description = "DualSense Compatible Controller";
                  } else if ("switch".equals(profile)) {
                      desc = DESC_SWITCH; name = "Pro Controller"; description = "Switch Pro Compatible Controller";
                  } else {
                      // Xbox 默认档严格沿用旧版本 SDP。
                      desc = DESC_XBOX; name = "Xbox Wireless Controller"; description = "Virtual Gamepad";
                  }
                  BluetoothHidDeviceAppSdpSettings sdp = new BluetoothHidDeviceAppSdpSettings(
                      name, description, "VPad", BluetoothHidDevice.SUBCLASS2_GAMEPAD, desc);
                  BluetoothHidDevice.Callback cb = newCallback();
                  boolean ok = false;
                  try {
                      BluetoothHidDeviceAppQosSettings qos = new BluetoothHidDeviceAppQosSettings(
                          BluetoothHidDeviceAppQosSettings.SERVICE_BEST_EFFORT, 800, 9, 0, 11250,
                          BluetoothHidDeviceAppQosSettings.MAX);
                      // 参数顺序是 (sdp, inQos, outQos, executor, callback)
                      ok = hidDevice.registerApp(sdp, null, qos, executor, cb);
                  } catch (Throwable ignored) {}
                  if (!ok) {
                      try { ok = hidDevice.registerApp(sdp, null, null, executor, cb); } catch (Throwable ignored) {}
                  }
                  if (ok) { lastReport = new byte[0]; lastSendNs = 0; }
                  return ok;
              }

              private BluetoothHidDevice.Callback newCallback() {
                  return new BluetoothHidDevice.Callback() {
                      @Override
                      public void onAppStatusChanged(BluetoothDevice plugged, boolean registered) {
                          status = registered ? "手柄已就绪:请在主机蓝牙里配对本手机" : "手柄服务已注销";
                          if (registered) { lastReport = new byte[0]; lastSendNs = 0; }
                      }

                      @Override
                      public void onConnectionStateChanged(BluetoothDevice device, int state) {
                          if (state == BluetoothProfile.STATE_CONNECTED) {
                              hostDevice = device;
                              lastReport = new byte[0];   // 新连接:第一份报告要立刻发出去
                              lastSendNs = 0;
                              status = "已连接: " + nameOf(device);
                              // 主动发一份"回中"报告:部分主机(尤其 Linux/模拟器)要等到第一份输入报告
                              // 才真正建立输入设备节点,否则会显示"已连接但没反应"。
                              try {
                                  BluetoothHidDevice h = hidDevice;
                                  byte[] init = idleReport(reportSize());
                                  int rid = "switch".equals(profile) ? 0x30 : 1;
                                  if (h != null && h.sendReport(device, rid, init)) {
                                      lastReport = init;
                                      currentReport = init;
                                      lastSendNs = System.nanoTime();
                                  }
                              } catch (Throwable ignored) {}
                          } else if (state == BluetoothProfile.STATE_DISCONNECTED) {
                              if (hostDevice != null && hostDevice.equals(device)) hostDevice = null;
                              status = "已断开 (在主机端重新连接即可)";
                          }
                      }

                      /** Windows / Linux 连上 HID 设备后通常会先发一次 GET_REPORT 取当前输入报告。
                       *  默认实现什么都不回,主机会认为设备无响应 —— 这正是"配对成功但手柄用不了"的常见原因。
                       *  注意 Callback 里是 void,必须用 replyReport() 回。 */
                      @Override
                      public void onGetReport(BluetoothDevice device, byte type, byte id, int bufferSize) {
                          BluetoothHidDevice h = hidDevice;
                          if (h == null) return;
                          try {
                              if (type == BluetoothHidDevice.REPORT_TYPE_FEATURE) {
                                  h.reportError(device, BluetoothHidDevice.ERROR_RSP_UNSUPPORTED_REQ);
                                  return;
                              }
                              byte[] cur = currentReport;
                              byte[] data;
                              if (cur == null || cur.length == 0) {
                                  data = idleReport(bufferSize);
                              } else if (bufferSize <= 0 || bufferSize == cur.length) {
                                  data = Arrays.copyOf(cur, cur.length);
                              } else {
                                  data = Arrays.copyOf(cur, bufferSize);
                              }
                              h.replyReport(device, type, id, data);
                          } catch (Throwable ignored) {}
                      }

                      /** 主机下发的输出报告(震动/LED 等):接受并忽略;拒绝会让部分主机判定握手失败。 */
                      @Override
                      public void onSetReport(BluetoothDevice device, byte type, byte id, byte[] data) {
                          BluetoothHidDevice h = hidDevice;
                          if (h == null) return;
                          try { h.reportError(device, BluetoothHidDevice.ERROR_RSP_SUCCESS); } catch (Throwable ignored) {}
                      }

                      @Override
                      public void onVirtualCableUnplug(BluetoothDevice device) {
                          hostDevice = null;
                          currentReport = null;
                          status = "主机端已断开";
                      }
                  };
              }

              /** 还没收到过输入报告时,给主机一份"全部回中"的报告。 */
              private byte[] idleReport(int bufferSize) {
                  int n = bufferSize > 0 ? bufferSize : reportSize();
                  byte[] r = new byte[n];
                  if ("xbox".equals(profile)) {
                      if (n >= 8) { put16(r, 0, 32768); put16(r, 2, 32768); put16(r, 4, 32768); put16(r, 6, 32768); }
                  } else if ("ps5".equals(profile)) {
                      Arrays.fill(r, (byte) 128);
                  } else if ("switch".equals(profile)) {
                      if (n >= 11) { put16(r, 3, 32768); put16(r, 5, 32768); put16(r, 7, 32768); put16(r, 9, 32768); }
                  }
                  // dinput: 全 0 即回中(8-bit 有符号轴)
                  return r;
              }

              private int reportSize() {
                  if ("dinput".equals(profile) || "ps5".equals(profile)) return 9;
                  if ("switch".equals(profile)) return 13;
                  return 16;
              }

              private String nameOf(BluetoothDevice d) {
                  try { String n = d.getName(); return n != null ? n : d.getAddress(); }
                  catch (Throwable t) { return d.getAddress(); }
              }

              private void makeDiscoverable() {
                  try {
                      Intent i = new Intent(BluetoothAdapter.ACTION_REQUEST_DISCOVERABLE);
                      i.putExtra(BluetoothAdapter.EXTRA_DISCOVERABLE_DURATION, 300);
                      startActivity(i);
                  } catch (Throwable t) { status = "无法设为可发现: " + t.getMessage(); }
              }

              private void enableBluetooth() {
                  try {
                      startActivity(new Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE));
                  } catch (Throwable t) {
                      status = "请在系统设置里打开蓝牙: " + t.getMessage();
                  }
              }

              private List<List<String>> bonded() {
                  List<List<String>> out = new ArrayList<>();
                  try {
                      if (adapter == null) return out;
                      Set<BluetoothDevice> s = adapter.getBondedDevices();
                      if (s != null) for (BluetoothDevice d : s) out.add(Arrays.asList(nameOf(d), d.getAddress()));
                  } catch (Throwable ignored) {}
                  return out;
              }

              private void connectHost(String address) {
                  try {
                      if (hidDevice != null && adapter != null) hidDevice.connect(adapter.getRemoteDevice(address));
                  } catch (Throwable t) { status = "连接失败: " + t.getMessage(); }
              }

              // ------------------------------------------------------------------
              // 状态 -> HID 报告
              // ------------------------------------------------------------------
              private static int hat(int m) {
                  boolean u = (m & UP) != 0, d = (m & DOWN) != 0, l = (m & LEFT) != 0, r = (m & RIGHT) != 0;
                  if (u && r) return 2;
                  if (r && d) return 4;
                  if (d && l) return 6;
                  if (l && u) return 8;
                  if (u) return 1;
                  if (r) return 3;
                  if (d) return 5;
                  if (l) return 7;
                  return 0;
              }

              private static int axis16(byte v) {
                  int a = 32768 + Math.round(v / 127f * 32767f);
                  return Math.max(0, Math.min(65535, a));
              }

              private static void put16(byte[] r, int off, int v) {
                  r[off] = (byte) (v & 0xFF);
                  r[off + 1] = (byte) ((v >> 8) & 0xFF);
              }

              private byte[] buildDinputReport(int mask, byte[] s) {
                  int btn = 0;
                  if ((mask & A) != 0) btn |= 1 << 0;
                  if ((mask & B) != 0) btn |= 1 << 1;
                  if ((mask & X) != 0) btn |= 1 << 2;
                  if ((mask & Y) != 0) btn |= 1 << 3;
                  if ((mask & L1) != 0) btn |= 1 << 4;
                  if ((mask & R1) != 0) btn |= 1 << 5;
                  if ((mask & SELECT) != 0) btn |= 1 << 6;
                  if ((mask & START) != 0) btn |= 1 << 7;
                  if ((mask & L3) != 0) btn |= 1 << 8;
                  if ((mask & R3) != 0) btn |= 1 << 9;
                  if ((mask & HOME) != 0) btn |= 1 << 10;
                  if ((mask & L2) != 0) btn |= 1 << 11;
                  if ((mask & R2) != 0) btn |= 1 << 12;
                  byte[] r = new byte[9];
                  r[0] = (byte)(btn & 0xFF); r[1] = (byte)((btn >> 8) & 0xFF);
                  r[2] = (byte)hat(mask);
                  r[3] = s[4]; r[4] = s[5]; r[5] = s[6]; r[6] = s[7];
                  r[7] = s[8]; r[8] = s[9];
                  return r;
              }

              private byte[] buildXboxReport(int mask, byte[] s) {
                  int btn = 0;
                  if ((mask & A) != 0) btn |= 1 << 0;
                  if ((mask & B) != 0) btn |= 1 << 1;
                  if ((mask & X) != 0) btn |= 1 << 3;
                  if ((mask & Y) != 0) btn |= 1 << 4;
                  if ((mask & L1) != 0) btn |= 1 << 6;
                  if ((mask & R1) != 0) btn |= 1 << 7;
                  if ((mask & L2) != 0) btn |= 1 << 8;
                  if ((mask & R2) != 0) btn |= 1 << 9;
                  if ((mask & SELECT) != 0) btn |= 1 << 10;
                  if ((mask & START) != 0) btn |= 1 << 11;
                  if ((mask & HOME) != 0) btn |= 1 << 12;
                  if ((mask & L3) != 0) btn |= 1 << 13;
                  if ((mask & R3) != 0) btn |= 1 << 14;
                  byte[] r = new byte[16];
                  put16(r, 0, axis16(s[4])); put16(r, 2, axis16(s[5]));
                  put16(r, 4, axis16(s[6])); put16(r, 6, axis16(s[7]));
                  put16(r, 8, (s[8] & 0xFF) * 1023 / 255);
                  put16(r, 10, (s[9] & 0xFF) * 1023 / 255);
                  r[12] = (byte)hat(mask);
                  r[13] = (byte)(btn & 0xFF); r[14] = (byte)((btn >> 8) & 0xFF);
                  r[15] = 0;
                  return r;
              }

              private byte[] buildPs5Report(int mask, byte[] s) {
                  // DualSense BT Report 1 basic payload; report ID is supplied separately.
                  byte[] r = new byte[9];
                  r[0] = (byte)((s[4] & 0xFF) + 128); // X
                  r[1] = (byte)((s[5] & 0xFF) + 128); // Y
                  r[2] = (byte)((s[6] & 0xFF) + 128); // Z  = right X
                  r[3] = (byte)((s[7] & 0xFF) + 128); // Rz = right Y
                  int h1 = hat(mask);
                  int b0 = (h1 == 0 ? 8 : h1 - 1) & 0x0F; // 0..7 clockwise from up, 8 = neutral
                  if ((mask & X) != 0) b0 |= 1 << 4; // Square
                  if ((mask & A) != 0) b0 |= 1 << 5; // Cross
                  if ((mask & B) != 0) b0 |= 1 << 6; // Circle
                  if ((mask & Y) != 0) b0 |= 1 << 7; // Triangle
                  int b1 = 0;
                  if ((mask & L1) != 0) b1 |= 1;
                  if ((mask & R1) != 0) b1 |= 2;
                  if ((mask & L2) != 0) b1 |= 4;
                  if ((mask & R2) != 0) b1 |= 8;
                  if ((mask & SELECT) != 0) b1 |= 1 << 4;
                  if ((mask & START) != 0) b1 |= 1 << 5;
                  if ((mask & L3) != 0) b1 |= 1 << 6;
                  if ((mask & R3) != 0) b1 |= 1 << 7;
                  r[4] = (byte)b0;
                  r[5] = (byte)b1;
                  r[6] = (byte)((mask & HOME) != 0 ? 1 : 0);
                  r[7] = s[8]; // Rx = L2
                  r[8] = s[9]; // Ry = R2
                  return r;
              }

              private static void put12(byte[] r, int off, int x, int y) {
                  r[off] = (byte)(x & 0xFF);
                  r[off + 1] = (byte)(((x >> 8) & 0x0F) | ((y & 0x0F) << 4));
                  r[off + 2] = (byte)((y >> 4) & 0xFF);
              }

              private int reportCounter = 0;

              private byte[] buildSwitchReport(int mask, byte[] s) {
                  // Switch-style standard HID: 24 buttons + 4 unsigned 16-bit axes + 2 padding bytes.
                  byte[] r = new byte[13];
                  int rb = 0, sb = 0, lb = 0;
                  if ((mask & Y) != 0) rb |= 0x01;
                  if ((mask & X) != 0) rb |= 0x02;
                  if ((mask & B) != 0) rb |= 0x04;
                  if ((mask & A) != 0) rb |= 0x08;
                  if ((mask & R1) != 0) rb |= 0x40;
                  if ((mask & R2) != 0) rb |= 0x80;
                  if ((mask & SELECT) != 0) sb |= 0x01; // Minus
                  if ((mask & START) != 0) sb |= 0x02;  // Plus
                  if ((mask & R3) != 0) sb |= 0x04;
                  if ((mask & L3) != 0) sb |= 0x08;
                  if ((mask & HOME) != 0) sb |= 0x10;
                  if ((mask & DOWN) != 0) lb |= 0x01;
                  if ((mask & UP) != 0) lb |= 0x02;
                  if ((mask & RIGHT) != 0) lb |= 0x04;
                  if ((mask & LEFT) != 0) lb |= 0x08;
                  if ((mask & L1) != 0) lb |= 0x40;
                  if ((mask & L2) != 0) lb |= 0x80;
                  r[0] = (byte)rb; r[1] = (byte)sb; r[2] = (byte)lb;
                  int lx = 32768 + Math.round(s[4] / 127f * 32767f);
                  int ly = 32768 + Math.round(s[5] / 127f * 32767f);
                  int rx = 32768 + Math.round(s[6] / 127f * 32767f);
                  int ry = 32768 + Math.round(s[7] / 127f * 32767f);
                  put16(r, 3, lx); put16(r, 5, ly); put16(r, 7, rx); put16(r, 9, ry);
                  r[11] = 0; r[12] = 0;
                  return r;
              }

              private void sendState(byte[] s) {
                  BluetoothHidDevice h = hidDevice;
                  BluetoothDevice host = hostDevice;
                  if (h == null || host == null || s.length < 10) return;
                  int mask = (s[0] & 0xFF) | ((s[1] & 0xFF) << 8) | ((s[2] & 0xFF) << 16) | ((s[3] & 0xFF) << 24);
                  byte[] r;
                  if ("dinput".equals(profile)) {
                      r = buildDinputReport(mask, s);
                  } else if ("ps5".equals(profile)) {
                      r = buildPs5Report(mask, s);
                  } else if ("switch".equals(profile)) {
                      r = buildSwitchReport(mask, s);
                  } else {
                      r = buildXboxReport(mask, s);
                  }
                  long now = System.nanoTime();
                  byte[] prev = lastReport;
                  boolean same = prev.length == r.length && Arrays.equals(prev, r);
                  // 状态没变:1s 一次保活足够;状态变了:最少间隔 4ms,避免把报告堆进蓝牙队列。
                  // 被节流掉的那一帧不会丢:下一次 tick 送的是同样的最新状态,和 lastReport 仍然不同。
                  long minGap = same ? 1_000_000_000L : 4_000_000L;
                  if (now - lastSendNs < minGap) return;
                  try {
                      int reportId = "switch".equals(profile) ? 0x30 : 1;
                      if (h.sendReport(host, reportId, r)) {
                          lastReport = r;        // 整块替换:读线程看到的永远是完整报告
                          currentReport = r;
                          lastSendNs = now;
                      }
                  } catch (Throwable ignored) {}
              }
          }
          EOF

          cat << 'EOF' > patch_manifest.py
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = (
              '<uses-feature android:name="android.hardware.bluetooth" android:required="false" />\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n'
              '    <application'
          )
          assert "<application" in s
          s = s.replace("<application", perms, 1)

          # 应用名和横屏锁:只影响外观,匹配不到就跳过,不能让构建失败
          import glob
          import re

          if re.search(r'android:label="[^"]*"', s):
              s = re.sub(r'android:label="[^"]*"',
                         'android:label="Pro Virtual Gamepad"\n        android:screenOrientation="sensorLandscape"',
                         s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")

          # BluetoothHidDevice 需要 API 28+。模板里通常是 "minSdk = flutter.minSdkVersion"
          patched = False
          for g in glob.glob("android/app/build.gradle*"):
              t = open(g, encoding="utf-8").read()
              kts = g.endswith(".kts")
              new = re.sub(r"minSdk(Version)?(\s*=\s*|\s+)flutter\.minSdkVersion",
                           "minSdk = 28" if kts else "minSdkVersion 28", t)
              if new == t:
                  # 兜底:模板改成了字面量(例如 minSdk = 21 / minSdkVersion 21)
                  new = re.sub(r"(minSdk(?:Version)?\s*(?:=\s*)?)\d+", r"\g<1>28", t, count=1)
              assert new != t, "minSdk not patched in " + g
              open(g, "w", encoding="utf-8").write(new)
              patched = True
              print("minSdk set to 28 in", g)
          assert patched, "no android/app/build.gradle* found"

          EOF
          python3 patch_manifest.py

          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Installer
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
