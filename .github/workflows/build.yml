          flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Installer
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate Project and Build IPA
        run: |
          flutter create --org com.example --project-name virtual_gamepad --platforms=android,ios -a java -i swift app_build
          cd app_build
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r VirtualGamepad-iOS.ipa Payload
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Installer
          path: app_build/VirtualGamepad-iOS.ipa
