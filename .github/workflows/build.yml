            Widget _buildPositionedControl(PadWidgetConfig cfg, Size screenSize) {
              final bool isStick = cfg.id == 'LEFT_STICK' || cfg.id == 'RIGHT_STICK';
              final double finalSize = (isStick ? 135.0 : 58.0) * cfg.scale;
              final double left = (cfg.xRatio * screenSize.width) - finalSize / 2;
              final double top = (cfg.yRatio * screenSize.height) - finalSize / 2;

              Widget child;
              if (cfg.id == 'LEFT_STICK') {
                child = _buildAnalogStick(
                  size: finalSize,
                  label: 'L',
                  value: _leftStickPos,
                  activePointer: _leftStickPointer,
                  onPointerChanged: (p) => _leftStickPointer = p,
                  onChanged: (v) {
                    setState(() => _leftStickPos = v);
                    _requestSend();
                  },
                );
              } else if (cfg.id == 'RIGHT_STICK') {
                child = _isRightStickSwipeMode
                    ? _buildSwipeZone(finalSize)
                    : _buildAnalogStick(
                        size: finalSize,
                        label: 'R',
                        value: _rightStickPos,
                        activePointer: _rightStickPointer,
                        onPointerChanged: (p) => _rightStickPointer = p,
                        onChanged: (v) {
                          setState(() => _rightStickPos = v);
                          _requestSend();
                        },
                      );
              } else {
                child = _buildActionButton(cfg.fn, _label(cfg.fn), finalSize);
              }
              child = RepaintBoundary(child: child);

              return Positioned(
                left: left.clamp(0.0, math.max(0.0, screenSize.width - finalSize)).toDouble(),
                top: top.clamp(0.0, math.max(0.0, screenSize.height - finalSize)).toDouble(),
                child: _isEditLayoutMode
                    ? GestureDetector(
                        onTap: () => setState(() => _selectedWidgetId = cfg.id),
                        onPanUpdate: (d) {
                          setState(() {
                            _selectedWidgetId = cfg.id;
                            cfg.xRatio = ((cfg.xRatio * screenSize.width + d.delta.dx) / screenSize.width).clamp(0.04, 0.96).toDouble();
                            cfg.yRatio = ((cfg.yRatio * screenSize.height + d.delta.dy) / screenSize.height).clamp(0.08, 0.94).toDouble();
                          });
                        },
                        child: Container(
                          decoration: BoxDecoration(
                            border: Border.all(color: _selectedWidgetId == cfg.id ? Colors.amberAccent : Colors.redAccent, width: 2),
                            borderRadius: BorderRadius.circular(12),
                          ),
                          child: AbsorbPointer(child: child),
                        ),
                      )
                    : child,
              );
            }

            /// 使用底层 Listener + 独立 pointerId 跟踪代替 GestureDetector(onPan)，
            /// 彻底解决多指触控冲突、全屏滑屏手势抢夺以及正交/斜向 8 方向死锁问题。
            Widget _buildAnalogStick({
              required double size,
              required String label,
              required Offset value,
              required int? activePointer,
              required ValueChanged<int?> onPointerChanged,
              required ValueChanged<Offset> onChanged,
            }) {
              final double radius = size / 2;
              final double knob = size * 0.22;
              final double maxDist = math.max(1.0, radius - knob);

              void update(Offset local) {
                final double dx = local.dx - radius;
                final double dy = local.dy - radius;
                final double dist = math.sqrt(dx * dx + dy * dy);

                double nx;
                double ny;
                if (dist > maxDist && dist > 0.0) {
                  nx = dx / dist;
                  ny = dy / dist;
                } else {
                  nx = dx / maxDist;
                  ny = dy / maxDist;
                }

                nx = nx.clamp(-1.0, 1.0).toDouble();
                ny = ny.clamp(-1.0, 1.0).toDouble();
                onChanged(Offset(nx, ny));
              }

              return Listener(
                behavior: HitTestBehavior.opaque,
                onPointerDown: (PointerDownEvent e) {
                  if (activePointer == null) {
                    onPointerChanged(e.pointer);
                    update(e.localPosition);
                  }
                },
                onPointerMove: (PointerMoveEvent e) {
                  if (activePointer == e.pointer) {
                    update(e.localPosition);
                  }
                },
                onPointerUp: (PointerUpEvent e) {
                  if (activePointer == e.pointer) {
                    onPointerChanged(null);
                    onChanged(Offset.zero);
                  }
                },
                onPointerCancel: (PointerCancelEvent e) {
                  if (activePointer == e.pointer) {
                    onPointerChanged(null);
                    onChanged(Offset.zero);
                  }
                },
                child: Container(
                  width: size,
                  height: size,
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    color: const Color(0x14FFFFFF),
                    border: Border.all(color: const Color(0x6600E5FF), width: 2),
                  ),
                  child: Stack(
                    alignment: Alignment.center,
                    children: [
                      // 十字与八向参考刻度线，方便直观确认上下左右与斜向输出
                      Container(width: size * 0.82, height: 1, color: const Color(0x2200E5FF)),
                      Container(width: 1, height: size * 0.82, color: const Color(0x2200E5FF)),
                      Transform.translate(
                        offset: Offset(value.dx * maxDist, value.dy * maxDist),
                        child: Container(
                          width: knob * 2,
                          height: knob * 2,
                          decoration: const BoxDecoration(
                            shape: BoxShape.circle,
                            color: Color(0xBF00E5FF),
                            boxShadow: [BoxShadow(color: Colors.black54, blurRadius: 6)],
                          ),
                          alignment: Alignment.center,
                          child: Text(label, style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildSwipeZone(double size) {
              return Listener(
                behavior: HitTestBehavior.opaque,
                onPointerDown: (e) {
                  _swipePointer ??= e.pointer;
                },
                onPointerMove: (e) {
                  if (_swipePointer == e.pointer) {
                    _onSwipeDelta(e.delta);
                  }
                },
                onPointerUp: (e) {
                  if (_swipePointer == e.pointer) _swipePointer = null;
                },
                onPointerCancel: (e) {
                  if (_swipePointer == e.pointer) _swipePointer = null;
                },
                child: Container(
                  width: size * 1.25,
                  height: size,
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(20),
                    color: const Color(0x1400E5FF),
                    border: Border.all(color: const Color(0x8000E5FF), width: 1.5),
                  ),
                  child: const Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.touch_app, color: Colors.cyanAccent, size: 28),
                      SizedBox(height: 4),
                      Text('3D 滑屏视角触控区', style: TextStyle(fontSize: 11, color: Colors.cyanAccent)),
                    ],
                  ),
                ),
              );
            }

            Widget _buildActionButton(String id, String label, double size) {
