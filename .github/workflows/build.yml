              final bool pressed = _pressedButtons.contains(id);
              return Listener(
                onPointerDown: _isEditLayoutMode ? null : (_) { setState(() => _pressedButtons.add(id)); _requestSend(); },
                onPointerUp: _isEditLayoutMode ? null : (_) { setState(() => _pressedButtons.remove(id)); _requestSend(); },
                onPointerCancel: _isEditLayoutMode ? null : (_) { setState(() => _pressedButtons.remove(id)); _requestSend(); },
