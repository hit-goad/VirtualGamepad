                    _rawGyroY = (gyro[1] as num).toDouble();
                    _rawGyroZ = (gyro[2] as num).toDouble();
                    const double gyroDeadzone = 0.03;
                    double yawRate = -_rawGyroZ;
                    double pitchRate = -_rawGyroY;
                    if (yawRate.abs() < gyroDeadzone) yawRate = 0.0;
                    if (pitchRate.abs() < gyroDeadzone) pitchRate = 0.0;
                    if (mounted) {
